<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <h1>Pokemon Explorer</h1>

        <nav aria-label="Main navigation">
            <a href="index.html" class="active">Home</a>
            <a href="#pokemon-list">Pokemon</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main>
        <section class="search-section">
            <h2>Explore Pokemon</h2>
            <p>Search for Pokemon and view their information.</p>

            <form id="search-form">
                <label for="pokemon-search">Search Pokemon:</label>
                <input type="search" id="pokemon-search" name="pokemon-search" placeholder="Enter a Pokemon name">

                <button type="submit">Search</button>

                <label for="type-filter">Type:</label>
                <select id="type-filter" name="type-filter">
                    <option value="all">All Types</option>
                    <option value="fire">Fire</option>
                    <option value="water">Water</option>
                    <option value="grass">Grass</option>
                    <option value="electric">Electric</option>
                </select>

                <button type="reset">Clear</button>
            </form>
        </section>
        
    </main>

    <footer>
        <p>Pokemon Explorer | Powered by PokéAPI</p>
    </footer>
</body>

</html>
